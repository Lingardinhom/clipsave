app = "clipsave-api"
primary_region = "sin"

[build]
  dockerfile = "../backend/Dockerfile"

[env]
  PORT = "8000"
  ENABLE_WEB_UI = "true"
  FILE_TTL_SECONDS = "600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
