services:
  clipsave:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: clipsave-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUTO_UPDATE_YTDLP=true
    volumes:
      - clipsave_tmp:/tmp/clipsave

volumes:
  clipsave_tmp:
